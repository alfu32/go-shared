name: Go release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and release (leave empty for validation only)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
          - runner: windows-latest
            goos: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build and package Linux Go distribution
        if: matrix.goos == 'linux'
        run: GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash -distpack
        working-directory: src

      - name: Build and package Windows Go distribution
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $env:GOROOT_BOOTSTRAP = (go env GOROOT)
          .\make.bat -distpack
        working-directory: src

      - name: Verify Go command packages
        if: matrix.goos == 'linux'
        run: bin/go test cmd/go/internal/fsys cmd/go/internal/modindex

      - name: Verify Go command packages
        if: matrix.goos == 'windows'
        shell: pwsh
        run: .\bin\go.exe test cmd/go/internal/fsys cmd/go/internal/modindex

      - uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.goos }}-amd64
          path: src/pkg/distpack/*.${{ matrix.goos }}-amd64.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'linux'
        with:
          name: go-source
          path: src/pkg/distpack/*.src.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: release-assets
          merge-multiple: true

      - name: Publish Go distributions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$REPOSITORY" --title "Go $TAG"
          else
            gh release create "$TAG" release-assets/* --repo "$REPOSITORY" --verify-tag --generate-notes --title "Go $TAG"
          fi
