name: Go release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and release (leave empty for validation only)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
          - runner: windows-latest
            goos: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build and package Linux Go distribution
        if: matrix.goos == 'linux'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="$RELEASE_TAG"
          else
            minor=$(sed -n 's/^const Version = \([0-9][0-9]*\)$/\1/p' internal/goversion/goversion.go)
            version="go1.${minor}-devel"
          fi
          printf '%s\n' "$version" > ../VERSION
          go_bin=$(readlink -f "$(command -v go)")
          GOROOT_BOOTSTRAP="$(dirname "$(dirname "$go_bin")")" ./make.bash -distpack
        working-directory: src

      - name: Build and package Windows Go distribution
        if: matrix.goos == 'windows'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG) {
            $version = $env:RELEASE_TAG
          } else {
            $minor = (Select-String -Path internal/goversion/goversion.go -Pattern '^const Version = ([0-9]+)$').Matches[0].Groups[1].Value
            $version = "go1.$minor-devel"
          }
          Set-Content -NoNewline -Path ..\VERSION -Value "$version`n"
          $goBin = (Get-Command go).Source
          $env:GOROOT_BOOTSTRAP = Split-Path (Split-Path $goBin)
          .\make.bat -distpack
        working-directory: src

      - name: Verify Go command packages
        if: matrix.goos == 'linux'
        run: bin/go test cmd/go/internal/fsys cmd/go/internal/modindex

      - name: Verify Go command packages
        if: matrix.goos == 'windows'
        shell: pwsh
        run: .\bin\go.exe test cmd/go/internal/fsys cmd/go/internal/modindex

      - name: Build GoX-aware gopls on Linux
        if: matrix.goos == 'linux'
        run: go build -o ../bin/gopls .
        working-directory: gopls

      - name: Build GoX-aware gopls on Windows
        if: matrix.goos == 'windows'
        run: go build -o ..\bin\gopls.exe .
        working-directory: gopls

      - uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.goos }}-amd64
          path: src/pkg/distpack/*.${{ matrix.goos }}-amd64.*
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'linux'
        with:
          name: go-source
          path: src/pkg/distpack/*.src.tar.gz
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: gopls-${{ matrix.goos }}-amd64
          path: bin/gopls*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Publish Go distributions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$REPOSITORY" --title "Go $TAG"
          else
            gh release create "$TAG" release-assets/* --repo "$REPOSITORY" --verify-tag --generate-notes --title "Go $TAG"
          fi
