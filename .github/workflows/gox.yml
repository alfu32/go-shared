name: GoX
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and release (leave empty for validation only)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - run: go test ./...
        working-directory: gox
      - run: go run ../../cmd/gox run .
        working-directory: gox/examples/counter
      - run: python gox/tools/sync_vendor.py
      - run: git diff --exit-code -- src/cmd/vendor
      - name: Build GoX CLI
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o dist/gox.exe ./cmd/gox
          else
            go build -o dist/gox ./cmd/gox
          fi
        working-directory: gox
      - name: Build goxpls language server
        shell: bash
        run: |
          mkdir -p ../gox/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o ../gox/dist/goxpls.exe .
          else
            go build -o ../gox/dist/goxpls .
          fi
        working-directory: gopls
      - uses: actions/upload-artifact@v4
        with:
          name: gox-${{ runner.os }}
          path: gox/dist/*
          if-no-files-found: error

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - run: GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash
        working-directory: src
      - run: bin/go test cmd/go/internal/fsys cmd/go/internal/modindex
      - run: bin/go test cmd/go -run 'TestChdir|TestDocsUpToDate|TestScript/(gox_build|gox_views|gox_workspace|gox_cgo|build_overlay)$' -count=1
      - run: sh src/make-shared.sh
      - run: sh src/cmd/sharedlauncher/test-linux.sh
      - run: ../../../bin/go run .
        working-directory: gox/examples/counter

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [standalone, native-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gox-*
          path: release-assets
          merge-multiple: true
      - name: Publish GoX CLI and goxpls release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$REPOSITORY" --title "GoX and goxpls $TAG"
          else
            gh release create "$TAG" release-assets/* --repo "$REPOSITORY" --verify-tag --generate-notes --title "GoX and goxpls $TAG"
          fi
